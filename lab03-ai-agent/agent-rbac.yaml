apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-operator
  namespace: ai-agent-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-operator-role
  namespace: ai-agent-lab
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-operator-binding
  namespace: ai-agent-lab
subjects:
  - kind: ServiceAccount
    name: ai-operator
    namespace: ai-agent-lab
roleRef:
  kind: Role
  name: ai-operator-role
  apiGroup: rbac.authorization.k8s.io
