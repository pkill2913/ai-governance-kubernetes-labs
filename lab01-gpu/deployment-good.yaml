apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference
  namespace: ai-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-inference
  template:
    metadata:
      labels:
        app: ai-inference
    spec:
      containers:
        - name: inference
          image: nginx:alpine
          resources:
            limits:
              nvidia.com/gpu: 1
